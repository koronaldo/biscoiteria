[www]
; Em produção o FPM roda como www-data (padrão da imagem), dono de storage/ e bootstrap/cache.
; O fpm-pool.conf (local) força user=1000 por causa do bind mount do WSL — não usar aqui.
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500
request_terminate_timeout = 120s
