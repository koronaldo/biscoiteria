services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: biscoiteria_app
    volumes:
      - ./src:/var/www/html
    networks:
      - biscoiteria
    depends_on:
      - postgres

  nginx:
    image: nginx:1.25
    container_name: biscoiteria_nginx
    ports:
      - "8010:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - biscoiteria
    depends_on:
      - app

  postgres:
    image: postgres:15
    container_name: biscoiteria_postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: biscoiteria
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - biscoiteria

networks:
  biscoiteria:

volumes:
  pgdata:
